<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SÀI GÒN ĐEN ĐÁ POS & Invoice</title>
    <meta name="apple-mobile-web-app-title" content="SÀI GÒN ĐEN ĐÁ">
    <meta name="application-name" content="SÀI GÒN ĐEN ĐÁ">
    
    <link rel="icon" type="image/png" href="https://img.icons8.com/ios-filled/512/000000/cafe.png">
    <link class="apple-touch-icon" href="https://img.icons8.com/ios-filled/512/000000/cafe.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">

    <!-- html2canvas Library for capturing elements -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root {
            --bg-color: #f5f5f5;
            --card-bg: #ffffff;
            --text-main: #000000;
            --text-muted: #666666;
            --border-color: #cccccc;
            --highlight: #000000;
            --highlight-text: #ffffff;
            --control-active: #e0e0e0;
            --danger: #d9534f;
            --success: #5cb85c;
        }

        body { font-family: Arial, Helvetica, sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; padding-bottom: 90px; -webkit-tap-highlight-color: transparent; }

        .header { background-color: var(--card-bg); border-bottom: 2px solid var(--text-main); padding: 22px; text-align: center; position: sticky; top: 0; z-index: 10; }
        .header h1 { font-family: 'Montserrat', sans-serif; margin: 0; font-size: 1.8rem; color: var(--text-main); letter-spacing: 2px; text-transform: uppercase; font-weight: 900; }
        
        .container { padding: 16px; max-width: 600px; margin: 0 auto; box-sizing: border-box; }
        
        .card { background: var(--card-bg); border-radius: 8px; padding: 24px; margin-bottom: 20px; border: 1px solid var(--border-color); box-shadow: 0 2px 5px rgba(0,0,0,0.05); box-sizing: border-box; }
        .card-title { font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 800; color: var(--text-main); text-transform: uppercase; margin-top: 0; border-bottom: 3px solid var(--text-main); padding-bottom: 12px; margin-bottom: 20px; letter-spacing: 1px; }
        
        input[type="date"], input[type="number"], input[type="text"], select { width: 100%; padding: 14px; border: 1px solid var(--border-color); border-radius: 4px; font-size: 1rem; box-sizing: border-box; background-color: var(--card-bg); color: var(--text-main); outline: none; transition: 0.2s; font-family: Arial, Helvetica, sans-serif; font-weight: bold; }
        input:focus, select:focus { border-color: var(--text-main); box-shadow: 0 0 0 2px rgba(0,0,0,0.1); }
        input::placeholder { color: var(--text-muted); font-weight: normal; }
        label { display: block; font-size: 0.85rem; font-weight: bold; color: var(--text-main); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;}

        .date-display { font-family: 'Montserrat', sans-serif; font-size: 1.1rem; font-weight: 500; color: var(--text-main); text-align: center; margin-top: 15px; margin-bottom: 15px; text-transform: none; }

        .menu-item { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border-color); }
        .menu-item:last-child { border-bottom: none; }
        .item-info .name { font-weight: bold; font-size: 1.1rem; color: var(--text-main); } 
        .item-info .price { color: var(--text-muted); font-size: 0.9rem; margin-top: 4px; font-weight: bold; }
        
        .controls { display: flex; align-items: center; background: var(--card-bg); border-radius: 4px; overflow: hidden; border: 1px solid var(--text-main); }
        .btn-action { width: 42px; height: 42px; border: none; background: transparent; font-size: 1.4rem; font-weight: bold; color: var(--text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.1s; border-right: 1px solid var(--border-color); }
        .btn-action:last-child { border-right: none; border-left: 1px solid var(--border-color); }
        .btn-action:active { background: var(--control-active); }
        .qty { min-width: 40px; text-align: center; font-weight: bold; font-size: 1.1rem; color: var(--text-main); }

        .cost-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .cost-item { display: flex; flex-direction: column; height: 100%; }
        .cost-item label { margin-bottom: auto; padding-bottom: 8px; }
        .cost-item input { margin-bottom: 0; }

        .customer-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px dashed var(--border-color); }
        .customer-left { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .customer-left input[type="checkbox"] { width: 20px; height: 20px; cursor: pointer; accent-color: var(--text-main); }
        .customer-actions { display: flex; gap: 8px; }
        .btn-sm { padding: 6px 10px; border-radius: 4px; border: 1px solid var(--text-main); font-size: 0.8rem; font-weight: bold; cursor: pointer; background: transparent; }
        .btn-danger { color: var(--danger); border-color: var(--danger); }
        
        .customer-input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .customer-input-group input { padding: 10px; }

        .invoice-date-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 6px; 
            margin-bottom: 15px; 
            width: 100%;
            box-sizing: border-box;
        }
        .invoice-date-grid input[type="date"] {
            width: 100%;
            padding: 10px 4px;
            font-size: 0.8rem;
            box-sizing: border-box;
            text-align: center;
        }
        
        #sale-date {
            text-align: center;
        }

        #invoice-capture-area { padding: 25px; padding-top: 45px; margin-top: 20px; background: #ffffff; border-radius: 12px; border: 2px solid #000; box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: center; }
        .invoice-brand { font-family: 'Montserrat', sans-serif; font-size: 1.6rem; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
        .invoice-subtitle { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px; }
        .invoice-details-box { border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 15px 0; margin-bottom: 20px; text-align: left; }
        
        .invoice-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; font-size: 0.85rem; font-weight: bold; gap: 10px; }
        .invoice-item span:first-child { text-align: left; word-break: keep-all; }
        .invoice-item span:last-child { text-align: right; white-space: nowrap; }

        .invoice-total { font-size: 1.25rem; text-align: right; margin-top: 10px; padding-top: 10px; border-top: 2px solid #000; font-family: 'Montserrat', sans-serif; font-weight: 900; }
        
        .qr-section { margin-top: 25px; border-top: 1px dashed #cccccc; padding-top: 20px; display: flex; flex-direction: column; align-items: center; }
        .qr-section p { font-size: 0.8rem; font-weight: bold; color: var(--text-muted); margin-bottom: 12px; margin-top: 0; text-transform: uppercase; letter-spacing: 0.5px; }
        .qr-image { width: 220px; height: 220px; border: 1px solid var(--border-color); border-radius: 8px; padding: 5px; background: #fff; }

        .footer { position: fixed; bottom: 0; left: 0; width: 100%; background: var(--card-bg); padding: 16px; box-sizing: border-box; border-top: 2px solid var(--text-main); z-index: 20; }
        .btn-submit { font-family: 'Montserrat', sans-serif; width: 100%; max-width: 600px; margin: 0 auto; display: block; background-color: var(--highlight); color: var(--highlight-text); padding: 18px; border: none; border-radius: 4px; font-size: 1.1rem; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; transition: 0.2s; cursor: pointer; }
        .btn-submit:active { transform: scale(0.98); background-color: #333333; }
        
        .btn-load { font-family: 'Montserrat', sans-serif; width: 100%; background-color: transparent; border: 2px solid var(--text-main); color: var(--text-main); padding: 12px; border-radius: 4px; font-size: 1rem; font-weight: 800; cursor: pointer; transition: 0.2s; text-transform: none; margin-bottom: 10px; }
        .btn-load:active { background-color: var(--control-active); }

        #toast {
            visibility: hidden;
            min-width: 220px;
            background-color: var(--text-main);
            color: var(--card-bg);
            text-align: center;
            border-radius: 30px;
            padding: 14px 20px;
            position: fixed;
            z-index: 9999;
            left: 50%;
            bottom: 20px;
            transform: translateX(-50%);
            font-size: 0.95rem;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            opacity: 0;
            transition: opacity 0.3s, bottom 0.3s;
        }
        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 100px;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>SÀI GÒN ĐEN ĐÁ</h1>
</div>

<div class="container">
    <!-- DATE OF RECORD CARD -->
    <div class="card">
        <h2 class="card-title">Date of Record</h2>
        <input type="date" id="sale-date" onchange="handleDateChange()" style="margin-bottom: 0;">
        <div class="date-display" id="formatted-date"></div>
        <button class="btn-load" id="btnLoad" onclick="fetchData()">LOAD DATA</button>
    </div>

    <!-- DRINKS SOLD CARD -->
    <div class="card">
        <h2 class="card-title">Drinks Sold</h2>
        <div id="menu-list"></div>
    </div>

    <!-- DAILY CUSTOMER CARD -->
    <div class="card">
        <h2 class="card-title">Daily Customers</h2>
        <div class="customer-input-group">
            <input type="text" id="new-cust-name" placeholder="Name (e.g. A Hung)">
            <input type="number" id="new-cust-price" placeholder="Price (K)" style="width: 120px;">
            <button class="btn-sm" onclick="addCustomer()" style="background: var(--text-main); color: var(--card-bg); min-width: 60px;">Add</button>
        </div>
        <div id="customer-list"></div>
    </div>

    <!-- MATERIAL COSTS CARD -->
    <div class="card">
        <h2 class="card-title">Material Costs ($)</h2>
        <div class="cost-grid">
            <div class="cost-item">
                <label>Coffee</label>
                <input type="number" id="cost-coffee" placeholder="0" oninput="saveLocalState()">
            </div>
            <div class="cost-item">
                <label>Fresh Milk</label>
                <input type="number" id="cost-fresh_milk" placeholder="0" oninput="saveLocalState()">
            </div>
            <div class="cost-item">
                <label>Condensed Milk</label>
                <input type="number" id="cost-condensed_milk" placeholder="0" oninput="saveLocalState()">
            </div>
            <div class="cost-item">
                <label>Plastic Cup</label>
                <input type="number" id="cost-plastic_cup" placeholder="0" oninput="saveLocalState()">
            </div>
        </div>
    </div>

    <!-- CUSTOM INTERVAL INVOICE GENERATOR -->
    <div class="card">
        <h2 class="card-title">Generate Invoice Statement</h2>
        
        <div class="invoice-date-grid">
            <div>
                <label style="font-size: 0.75rem;">From Date</label>
                <input type="date" id="invoice-start">
            </div>
            <div>
                <label style="font-size: 0.75rem;">To Date</label>
                <input type="date" id="invoice-end">
            </div>
        </div>
        
        <div style="margin-bottom: 20px;">
            <label>Select Customer</label>
            <select id="invoice-customer-select"></select>
        </div>
        
        <button class="btn-load" id="btnInvoice" onclick="fetchRangeInvoices()" style="background-color: var(--text-main); color: var(--card-bg); margin-bottom: 0;">GENERATE INVOICE</button>

        <!-- Generated Receipt Box (For Capture) -->
        <div id="invoice-container-box" style="display: none; margin-top: 25px;">
            <div id="invoice-capture-area">
                <div class="invoice-brand">SÀI GÒN ĐEN ĐÁ</div>
                <div class="invoice-subtitle" id="invoice-bill-title">Debt Bill</div>
                
                <div class="invoice-details-box">
                    <div style="font-size: 0.9rem; margin-bottom: 10px;">
                        <strong>Customer:</strong> <span id="bill-cust-name" style="text-transform: none;"></span>
                    </div>
                    <div style="font-size: 0.8rem; margin-bottom: 15px; color: var(--text-muted);">
                        <strong>Period:</strong> <span id="bill-period"></span>
                    </div>
                    
                    <div id="invoice-report-list"></div>
                </div>

                <!-- VietQR Auto-Generator Section -->
                <div class="qr-section">
                    <p>Scan with Mobile Banking to Pay</p>
                    <img id="vietqr-img" class="qr-image" src="" alt="Payment QR Code">
                    <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 12px; font-weight: bold;">
                        LE DINH KHANH - OCB - 0004100022246002
                    </div>
                </div>
            </div>
            
            <button class="btn-load" onclick="exportInvoiceToImage()" style="margin-top: 15px; background-color: #000; color: #fff; border: none;">📸 EXPORT IMAGE FILE</button>
        </div>
    </div>

    <!-- DAILY NOTES CARD -->
    <div class="card">
        <h2 class="card-title">Daily Notes</h2>
        <input type="text" id="note" placeholder="e.g., Weekend, heavy rain, etc." oninput="saveLocalState()" style="margin-bottom:0;">
    </div>
</div>

<div class="footer">
    <button class="btn-submit" id="btnSend" onclick="sendData()">Sync to Excel</button>
</div>

<div id="toast"></div>

<script>
    // --- NOTE: REPLACE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE ---
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwusW-aXDoL4gyuywmnZxeTsPHswvKenOY4uC0GhityagFJdIyFwxmM5eeJjTg-HX6gLw/exec";

    const menuData = [
        { id: "iced", name: "Iced Coffee", price: "$12" },
        { id: "milk", name: "Milk Coffee", price: "$15" },
        { id: "bacxiu", name: "Bac Xiu", price: "$15" },
        { id: "combo", name: "Combo", price: "$10" },
        { id: "iced_m", name: "Iced (Machine)", price: "$18" },
        { id: "milk_m", name: "Milk (Machine)", price: "$20" },
        { id: "combo_m", name: "Combo (Machine)", price: "$15" }
    ];

    let customers = [
        { name: "Nhân", defaultPrice: 12 },
        { name: "Đại", defaultPrice: 15 },
        { name: "A Hưng", defaultPrice: 15 },
        { name: "A Bắc", defaultPrice: 15 },
        { name: "Tài", defaultPrice: 15 },
        { name: "C Hoà", defaultPrice: 15 }
    ];

    let sales = {};
    menuData.forEach(item => sales[item.id] = 0);
    let selectedCustomers = []; 

    let toastTimeout;
    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.innerText = message;
        toast.classList.add("show");
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove("show");
        }, 3000);
    }

    function handleDateChange() {
        selectedCustomers = []; 
        saveLocalState();
        updateDateDisplay();
        renderCustomers();
    }

    function updateDateDisplay() {
        const dateInput = document.getElementById('sale-date').value;
        if (!dateInput) return;
        const d = new Date(dateInput);
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('formatted-date').innerText = d.toLocaleDateString('en-US', options);
    }

    function loadCustomers() {
        const savedCust = localStorage.getItem('dayupCustomers') || localStorage.getItem('comateCustomers') || localStorage.getItem('khoCoffeeCustomers');
        if (savedCust) {
            customers = JSON.parse(savedCust);
            localStorage.setItem('dayupCustomers', savedCust);
        }
        populateInvoiceCustomerDropdown();
    }

    function populateInvoiceCustomerDropdown() {
        const select = document.getElementById("invoice-customer-select");
        select.innerHTML = "";
        customers.forEach(c => {
            const opt = document.createElement("option");
            opt.value = c.name;
            opt.innerText = c.name;
            select.appendChild(opt);
        });
    }

    function saveCustomers() {
        localStorage.setItem('dayupCustomers', JSON.stringify(customers));
        renderCustomers();
        populateInvoiceCustomerDropdown();
    }

    function addCustomer() {
        const nameInput = document.getElementById('new-cust-name');
        const priceInput = document.getElementById('new-cust-price');
        const name = nameInput.value.trim();
        const price = parseInt(priceInput.value);

        if (!name || isNaN(price)) return showToast("Please input both Name and Price!");
        if (customers.some(c => c.name.toLowerCase() === name.toLowerCase())) return showToast("Customer already exists!");

        customers.push({ name: name, defaultPrice: price });
        nameInput.value = ""; priceInput.value = "";
        saveCustomers();
        showToast("Customer added successfully!");
    }

    function editCustomer(index) {
        const current = customers[index];
        const newName = prompt("Edit customer name:", current.name);
        if (newName === null) return;
        const newPrice = prompt("Edit default price (K):", current.defaultPrice);
        if (newPrice === null) return;

        if (newName.trim() && !isNaN(parseInt(newPrice))) {
            customers[index] = { name: newName.trim(), defaultPrice: parseInt(newPrice) };
            saveCustomers();
            showToast("Customer details updated!");
        } else {
            showToast("Invalid inputs entered!");
        }
    }

    function deleteCustomer(index) {
        if (confirm(`Are you sure you want to delete ${customers[index].name}?`)) {
            selectedCustomers = selectedCustomers.filter(name => name !== customers[index].name);
            customers.splice(index, 1);
            saveCustomers();
            saveLocalState();
            showToast("Customer deleted!");
        }
    }

    function toggleCustomerSelect(name) {
        if (selectedCustomers.includes(name)) {
            selectedCustomers = selectedCustomers.filter(c => c !== name);
        } else {
            selectedCustomers.push(name);
        }
        saveLocalState();
    }

    function renderCustomers() {
        let html = "";
        customers.forEach((cust, index) => {
            const isChecked = selectedCustomers.includes(cust.name) ? "checked" : "";
            html += `
            <div class="customer-row">
                <label class="customer-left">
                    <input type="checkbox" ${isChecked} onchange="toggleCustomerSelect('${cust.name}')">
                    <span style="text-transform: none;">${cust.name} ${cust.defaultPrice}K</span>
                </label>
                <div class="customer-actions">
                    <button class="btn-sm" onclick="editCustomer(${index})">Edit</button>
                    <button class="btn-sm btn-danger" onclick="deleteCustomer(${index})">Delete</button>
                </div>
            </div>`;
        });
        document.getElementById('customer-list').innerHTML = html || "<p style='color:var(--text-muted); font-size:0.9rem; text-align:center;'>No customers defined.</p>";
    }

    function generateProfitNote() {
        let parts = [];
        customers.forEach(c => {
            if (selectedCustomers.includes(c.name)) {
                parts.push(`${c.name} ${c.defaultPrice}K`);
            }
        });
        return parts.join(", ");
    }

    function saveLocalState() {
        const state = {
            date: document.getElementById('sale-date').value,
            sales: sales,
            selectedCustomers: selectedCustomers,
            costs: {
                coffee: document.getElementById('cost-coffee').value,
                fresh_milk: document.getElementById('cost-fresh_milk').value,
                condensed_milk: document.getElementById('cost-condensed_milk').value,
                plastic_cup: document.getElementById('cost-plastic_cup').value
            },
            note: document.getElementById('note').value
        };
        localStorage.setItem('dayupBackup', JSON.stringify(state));
    }

    function loadLocalState() {
        loadCustomers();
        const saved = localStorage.getItem('dayupBackup') || localStorage.getItem('comateBackup') || localStorage.getItem('khoCoffeeBackup');
        if (saved) {
            const state = JSON.parse(saved);
            if (state.date) document.getElementById('sale-date').value = state.date;
            if (state.sales) sales = state.sales;
            if (state.selectedCustomers) selectedCustomers = state.selectedCustomers;
            if (state.costs) {
                document.getElementById('cost-coffee').value = state.costs.coffee || '';
                document.getElementById('cost-fresh_milk').value = state.costs.fresh_milk || '';
                document.getElementById('cost-condensed_milk').value = state.costs.condensed_milk || '';
                document.getElementById('cost-plastic_cup').value = state.costs.plastic_cup || '';
            }
            if (state.note) document.getElementById('note').value = state.note || '';
            
            saveLocalState();
        } else {
            const today = new Date();
            const offset = today.getTimezoneOffset() * 60000;
            document.getElementById('sale-date').value = (new Date(today - offset)).toISOString().split('T')[0];
        }
        
        const currDateObj = new Date(document.getElementById('sale-date').value);
        const y = currDateObj.getFullYear();
        const m = currDateObj.getMonth();
        const formattedStart = `${y}-${("0" + (m+1)).slice(-2)}-01`;
        
        document.getElementById('invoice-start').value = formattedStart;
        document.getElementById('invoice-end').value = document.getElementById('sale-date').value;

        updateDateDisplay();
        renderCustomers();
    }

    function renderMenu() {
        let html = "";
        menuData.forEach(item => {
            html += `
            <div class="menu-item">
                <div class="item-info">
                    <div class="name">${item.name}</div>
                    <div class="price">${item.price}</div>
                </div>
                <div class="controls">
                    <button class="btn-action" onclick="updateQty('${item.id}', -1)">−</button>
                    <div class="qty" id="qty-${item.id}">${sales[item.id]}</div>
                    <button class="btn-action" onclick="updateQty('${item.id}', 1)">+</button>
                </div>
            </div>`;
        });
        document.getElementById('menu-list').innerHTML = html;
    }

    function updateQty(id, change) {
        if (sales[id] + change >= 0) {
            sales[id] += change;
            document.getElementById(`qty-${id}`).innerText = sales[id];
            saveLocalState();
            if (window.navigator && window.navigator.vibrate) navigator.vibrate(10);
        }
    }

    function formatDate(dateStr) {
        let parts = dateStr.split("-");
        return `${parts[2]}/${parts[1]}/${parts[0]}`; 
    }

    function formatEnglishDateWithoutYear(dateStr) {
        let parts = dateStr.split("/");
        if(parts.length !== 3) return dateStr;
        let day = parseInt(parts[0], 10);
        let month = parseInt(parts[1], 10) - 1;
        let year = parseInt(parts[2], 10);
        
        let dateObj = new Date(year, month, day);
        if(isNaN(dateObj)) return dateStr;

        const options = { weekday: 'short', month: 'short', day: 'numeric' };
        return dateObj.toLocaleDateString('en-US', options);
    }

    async function fetchData() {
        const dateVal = document.getElementById('sale-date').value;
        if (!dateVal) return showToast("Please select a date!");
        const btn = document.getElementById('btnLoad');
        btn.innerText = "Loading..."; btn.disabled = true;

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "read", date: formatDate(dateVal) }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });
            const result = await response.json();
            if (result.success) {
                sales = result.drinks;
                document.getElementById('cost-coffee').value = result.costs.coffee;
                document.getElementById('cost-fresh_milk').value = result.costs.fresh_milk;
                document.getElementById('cost-condensed_milk').value = result.costs.condensed_milk;
                document.getElementById('cost-plastic_cup').value = result.costs.plastic_cup;
                document.getElementById('note').value = result.note || "";
                renderMenu(); saveLocalState(); renderCustomers();
                showToast("Data loaded successfully!");
            } else {
                showToast(result.message);
            }
        } catch (error) {
            showToast("Error loading data from sheet!");
        } finally { 
            btn.innerText = "Load data"; 
            btn.disabled = false; 
        }
    }

    async function sendData() {
        const btn = document.getElementById('btnSend');
        const dateVal = document.getElementById('sale-date').value;
        if (!dateVal) return showToast("Please select a date!");

        const customerDebtString = generateProfitNote();
        const dailyNoteInput = document.getElementById('note').value.trim();
        let finalNoteContent = (customerDebtString && dailyNoteInput) ? `${customerDebtString} | ${dailyNoteInput}` : (customerDebtString || dailyNoteInput);

        const payload = {
            action: "write",
            date: formatDate(dateVal),
            drinks: sales,
            costs: {
                coffee: document.getElementById('cost-coffee').value,
                fresh_milk: document.getElementById('cost-fresh_milk').value,
                condensed_milk: document.getElementById('cost-condensed_milk').value,
                plastic_cup: document.getElementById('cost-plastic_cup').value
            },
            note: finalNoteContent
        };

        btn.innerText = "PROCESSING..."; btn.disabled = true;

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });
            const result = await response.json();
            if(result.success) {
                showToast("Synced successfully!");
                localStorage.removeItem('dayupBackup');
                selectedCustomers = [];
                menuData.forEach(item => sales[item.id] = 0);
                document.querySelectorAll('input[type="number"], input[type="text"]').forEach(el => el.value = "");
                renderMenu(); renderCustomers();
            } else {
                showToast(result.message);
            }
        } catch (error) {
            showToast("Connection error occurred!");
        } finally {
            btn.innerText = "SYNC TO EXCEL"; btn.disabled = false;
        }
    }

    async function fetchRangeInvoices() {
        const startDate = document.getElementById('invoice-start').value;
        const endDate = document.getElementById('invoice-end').value;
        const customerName = document.getElementById('invoice-customer-select').value;

        if (!startDate || !endDate) return showToast("Please select both dates!");
        if (!customerName) return showToast("Please select a customer!");

        const btn = document.getElementById('btnInvoice');
        btn.innerText = "Searching..."; btn.disabled = true;

        try {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ 
                    action: "read_range", 
                    startDate: startDate, 
                    endDate: endDate, 
                    customerName: customerName 
                }),
                headers: { 'Content-Type': 'text/plain;charset=utf-8' }
            });
            const result = await response.json();
            if (result.success && result.data && result.data.length > 0) {
                renderInvoiceBox(customerName, startDate, endDate, result.data);
            } else {
                showToast(`No records found for ${customerName} within selected period.`);
                hideInvoiceBox();
            }
        } catch (e) {
            showToast("Offline simulation mode active...");
            renderInvoiceBox(customerName, startDate, endDate, [
                { date: "01/07/2026", amount: 12000 },
                { date: "02/07/2026", amount: 12000 },
                { date: "03/07/2026", amount: 12000 },
                { date: "14/07/2026", amount: 15000 }
            ]);
        } finally {
            btn.innerText = "GENERATE INVOICE"; btn.disabled = false;
        }
    }

    function renderInvoiceBox(customerName, start, end, records) {
        document.getElementById('bill-cust-name').innerText = customerName;
        
        const startFormatted = formatEnglishDateWithoutYear(start.split("-").reverse().join("/"));
        const endFormatted = formatEnglishDateWithoutYear(end.split("-").reverse().join("/"));
        document.getElementById('bill-period').innerText = `${startFormatted} - ${endFormatted}`;

        let html = "";
        let totalSum = 0;

        records.forEach(r => {
            totalSum += r.amount;
            const englishDateStr = formatEnglishDateWithoutYear(r.date);
            html += `<div class="invoice-item">
                        <span>${englishDateStr}</span>
                        <span style="color: var(--danger);">${r.amount.toLocaleString('vi-VN')} VND</span>
                     </div>`;
        });

        html += `<div class="invoice-total">TOTAL AMOUNT: <span style="color:var(--success);">${totalSum.toLocaleString('vi-VN')} VND</span></div>`;
        document.getElementById('invoice-report-list').innerHTML = html;

        const BANK_ID = "OCB"; 
        const ACCOUNT_NO = "0004100022246002";
        const TEMPLATE = "compact2"; 
        const DESCRIPTION = encodeURIComponent(`${customerName} thanh toan ca phe`);
        
        const qrUrl = `https://api.vietqr.io/image/${BANK_ID}-${ACCOUNT_NO}-${TEMPLATE}.png?amount=${totalSum}&addInfo=${DESCRIPTION}`;
        
        const imgElement = document.getElementById("vietqr-img");
        imgElement.src = qrUrl;

        document.getElementById('invoice-container-box').style.display = "block";
    }

    function hideInvoiceBox() {
        document.getElementById('invoice-container-box').style.display = "none";
    }

    function exportInvoiceToImage() {
        const target = document.getElementById("invoice-capture-area");
        showToast("Generating image file, please wait...");

        html2canvas(target, { scale: 2, useCORS: true, backgroundColor: "#ffffff" }).then(canvas => {
            const imageURI = canvas.toDataURL("image/png");
            const customerName = document.getElementById('invoice-customer-select').value;
            
            const downloadLink = document.createElement("a");
            downloadLink.href = imageURI;
            downloadLink.download = `Invoice_SAI_GON_DEN_DA_${customerName}.png`;
            
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            
            showToast("Image saved successfully! 🎉");
        }).catch(err => {
            showToast("Failed to generate image. Please take a manual screenshot.");
        });
    }

    loadLocalState();
    renderMenu();
</script>

</body>
